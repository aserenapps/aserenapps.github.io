<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aseren Games</title>
<meta name="description" content="Calm, polished puzzle games by Aseren.">
<link rel="icon" href="sudoku/icon.png">
<style>
  :root { --bg: #f4f6fc; --card: #ffffff; --text: #141a33; --dim: #4a5274; --line: #d8ddee; --link: #2459c9; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #070b1a; --card: #10162c; --text: #eef1fb; --dim: #a9b0cc; --line: #232a4a; --link: #8cc3ff; }
  }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 720px; margin: 0 auto; padding: 48px 16px 64px; }
  h1 { font-size: 32px; line-height: 1.2; margin: 0 0 8px; }
  .lead { color: var(--dim); margin: 0 0 32px; }
  .game { display: flex; gap: 16px; align-items: center; padding: 16px; border-radius: 18px;
    background: var(--card); border: 1px solid var(--line); }
  .game img { width: 72px; height: 72px; border-radius: 17px; flex: none; }
  .game h2 { font-size: 20px; margin: 0 0 2px; }
  .game p { margin: 0 0 6px; color: var(--dim); }
  a { color: var(--link); }
  .links { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 15px; }
  footer { margin-top: 40px; color: var(--dim); font-size: 14px; }
</style>
</head>
<body>
<main>
<h1>Aseren Games</h1>
<p class="lead">Calm, polished puzzle games for phones and tablets.</p>

<section class="game">
  <img src="sudoku/icon.png" alt="Aseren Sudoku icon">
  <div>
    <h2>Aseren Sudoku</h2>
    <p>Four levels, a hands-on tutorial and no ads during play. Coming soon to Google Play.</p>
    <div class="links">
      <a href="sudoku/privacy-policy.html">Privacy policy</a>
      <a href="mailto:aserensudoku@gmail.com">Support</a>
    </div>
  </div>
</section>

<footer>
  Contact: <a href="mailto:aserensudoku@gmail.com">aserensudoku@gmail.com</a><br>
  © 2026 Aseren
</footer>
</main>
</body>
</html>
